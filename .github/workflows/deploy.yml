name: Deploy to GitHub Pages

on:
  push:
    # Deploys from the feature branch too, so the app is reachable before merge.
    branches: [master, claude/github-install-requirement-s2ymi2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serves a project site from /<repo>/, so the bundle needs that base.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Requires Pages to be enabled first: Settings -> Pages -> Source ->
      # GitHub Actions. The workflow token cannot turn it on by itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
